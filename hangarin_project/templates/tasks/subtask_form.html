{% extends "base.html" %}
{% block title %}{% if subtask %}Edit Subtask{% else %}New Subtask{% endif %} - Hangarin{% endblock %}
{% block content %}
<h1>{% if subtask %}Edit Subtask{% else %}New Subtask{% endif %} for "{{ task.title }}"</h1>
<form class="form-card" method="post" action="">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-secondary" href="{% url 'subtask_list' task.pk %}">Cancel</a>
    </div>
</form>
{% endblock %}
