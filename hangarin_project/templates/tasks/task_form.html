{% extends "base.html" %}
{% block title %}{% if task %}Edit Task{% else %}New Task{% endif %} - Hangarin{% endblock %}
{% block content %}
<h1>{% if task %}Edit Task{% else %}New Task{% endif %}</h1>
<form class="form-card" method="post" action="">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-secondary" href="{% if task %}{% url 'task_detail' task.pk %}{% else %}{% url 'task_list' %}{% endif %}">Cancel</a>
    </div>
</form>
{% endblock %}
