{% extends "base.html" %}
{% block title %}{% if note %}Edit Note{% else %}New Note{% endif %} - Hangarin{% endblock %}
{% block content %}
<h1>{% if note %}Edit Note{% else %}New Note{% endif %} for "{{ task.title }}"</h1>
<form method="post" action="">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>
<p><a href="{% url 'note_list' task.pk %}">Cancel</a></p>
{% endblock %}
