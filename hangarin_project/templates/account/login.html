{% extends "base.html" %}
{% load socialaccount %}
{% block title %}Login - Hangarin{% endblock %}
{% block content %}
<h1>Login</h1>
<p><a href="{% provider_login_url 'google' %}">Continue with Google</a></p>
<form method="post" action="{% url 'account_login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
</form>
<p><a href="{% url 'account_reset_password' %}">Forgot password?</a></p>
<p>Don't have an account? <a href="{% url 'account_signup' %}">Sign up</a></p>
{% endblock %}
