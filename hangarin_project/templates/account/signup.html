{% extends "base.html" %}
{% load socialaccount %}
{% block title %}Sign up - Hangarin{% endblock %}
{% block content %}
<h1>Sign up</h1>
<p><a href="{% provider_login_url 'google' %}">Continue with Google</a></p>
<form method="post" action="{% url 'account_signup' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign up</button>
</form>
<p>Already have an account? <a href="{% url 'account_login' %}">Login</a></p>
{% endblock %}
