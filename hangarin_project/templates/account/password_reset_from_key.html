{% extends "base.html" %}
{% block title %}Set new password - Hangarin{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h1>Set a new password</h1>
        <form class="form-card" method="post" action="{{ action_url }}">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <button class="btn btn-primary" type="submit">Change password</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
