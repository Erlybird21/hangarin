{% extends "base.html" %}
{% block title %}Reset password - Hangarin{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h1>Reset password</h1>
        <form class="form-card" method="post" action="{% url 'account_reset_password' %}">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <button class="btn btn-primary" type="submit">Send reset email</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
